<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Browse | Northstar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container">
        <a class="brand" href="index.html"
          ><span class="logo-placeholder">N</span><span>Northstar</span></a
        >
        <div class="nav-links">
          <a href="index.html">Home</a><a href="about.html">About us</a
          ><a href="browse.html">Browse</a
          ><a href="cart.html">Cart <span class="cart-count">0</span></a
          ><a href="login.html" class="nav-login">Account</a>
        </div>
      </nav>
    </header>
    <main class="section container">
      <p class="eyebrow">BROWSE</p>
      <h1>Our collection</h1>
      <section class="catalog-section">
        <p class="eyebrow">HIJABS</p>
        <h2>Hijabs</h2>
        <div class="product-grid">
          <article class="product-card">
            <div class="product-image image-one"></div>
            <h3>Classic Chiffon Hijab</h3>
            <p>$28.00</p>
            <button class="add-to-cart" data-product="Classic Chiffon Hijab">Add to cart</button>
          </article>
          <article class="product-card">
            <div class="product-image image-two"></div>
            <h3>Everyday Jersey Hijab</h3>
            <p>$30.00</p>
            <button class="add-to-cart" data-product="Everyday Jersey Hijab">Add to cart</button>
          </article>
          <article class="product-card">
            <div class="product-image image-three"></div>
            <h3>Satin Occasion Hijab</h3>
            <p>$35.00</p>
            <button class="add-to-cart" data-product="Satin Occasion Hijab">Add to cart</button>
          </article>
        </div>
      </section>
      <section class="catalog-section">
        <p class="eyebrow">ACCESSORIES</p>
        <h2>Accessories</h2>
        <div class="product-grid">
          <article class="product-card">
            <div class="product-image image-four"></div>
            <h3>Magnet Hijab Pins</h3>
            <p>$12.00</p>
            <button class="add-to-cart" data-product="Magnet Hijab Pins">Add to cart</button>
          </article>
          <article class="product-card">
            <div class="product-image image-five"></div>
            <h3>Undercap Set</h3>
            <p>$18.00</p>
            <button class="add-to-cart" data-product="Undercap Set">Add to cart</button>
          </article>
          <article class="product-card">
            <div class="product-image image-six"></div>
            <h3>Hijab Storage Bag</h3>
            <p>$22.00</p>
            <button class="add-to-cart" data-product="Hijab Storage Bag">Add to cart</button>
          </article>
        </div>
      </section>
    </main>
    <footer class="site-footer"><div class="container">© 2026 Northstar</div></footer>
    <script src="script.js"></script>
  </body>
</html>
