<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Reset password | Northstar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container">
        <a class="brand" href="index.html"
          ><span class="logo-placeholder">N</span><span>Northstar</span></a
        >
      </nav>
    </header>
    <main class="section container narrow">
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1>Reset your password</h1>
      <p class="section-copy">Enter your account email and we’ll send a reset link.</p>
      <form id="forgot-password-form" class="form-card">
        <label
          >Email <input name="email" type="email" required placeholder="you@example.com" /></label
        ><button class="button">Send reset link</button>
        <p id="forgot-password-message" class="form-message"></p>
      </form>
    </main>
    <footer class="site-footer"><div class="container">© 2026 Northstar</div></footer>
    <script src="script.js"></script>
  </body>
</html>
