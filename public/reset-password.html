<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Choose password | Northstar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container">
        <a class="brand" href="index.html"
          ><span class="logo-placeholder">N</span><span>Northstar</span></a
        >
      </nav>
    </header>
    <main class="section container narrow">
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1>Choose a new password</h1>
      <form id="reset-password-form" class="form-card">
        <label
          >New password
          <input
            name="password"
            type="password"
            minlength="8"
            required
            placeholder="At least 8 characters" /></label
        ><label
          >Confirm password
          <input name="confirmPassword" type="password" minlength="8" required /></label
        ><button class="button">Reset password</button>
        <p id="reset-password-message" class="form-message"></p>
      </form>
    </main>
    <footer class="site-footer"><div class="container">© 2026 Northstar</div></footer>
    <script src="script.js"></script>
  </body>
</html>
