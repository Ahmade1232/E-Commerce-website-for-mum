<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Account | Northstar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container">
        <a class="brand" href="index.html"
          ><span class="logo-placeholder">N</span><span>Northstar</span></a
        >
        <div class="nav-links">
          <a href="index.html">Home</a><a href="about.html">About us</a
          ><a href="browse.html">Browse</a
          ><a href="cart.html">Cart <span class="cart-count">0</span></a>
        </div>
      </nav>
    </header>
    <main class="section container narrow">
      <p class="eyebrow">ACCOUNT</p>
      <h1 id="account-title">Welcome</h1>
      <form id="login-form" class="form-card">
        <label>Email <input name="email" type="email" required /></label
        ><label>Password <input name="password" type="password" required /></label
        ><button class="button">Log in</button>
        <p id="login-message" class="form-message"></p>
      </form>
      <form id="register-form" class="form-card register-form">
        <h3>Create an account</h3>
        <label>Name <input name="name" required /></label
        ><label>Email <input name="email" type="email" required /></label
        ><label>Password <input name="password" type="password" minlength="8" required /></label
        ><button class="button">Register</button>
        <p id="register-message" class="form-message"></p>
      </form>
      <div id="signed-in" hidden>
        <p id="signed-in-message"></p>
        <a id="admin-link" class="button" href="admin.html" hidden>Admin controls</a>
        <button id="logout-button">Log out</button>
      </div>
    </main>
    <footer class="site-footer"><div class="container">© 2026 Northstar</div></footer>
    <script src="script.js"></script>
  </body>
</html>
